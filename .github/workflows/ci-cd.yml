name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  deploy:
    # Only deploy real pushes to main, after tests pass.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render (inject Supabase secrets, then trigger deploy)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail

          # Skip cleanly until the Render secrets are configured, so the
          # workflow stays green before deployment is set up.
          if [ -z "${RENDER_API_KEY}" ] || [ -z "${RENDER_SERVICE_ID}" ]; then
            echo "Render secrets not set yet — skipping deploy."
            exit 0
          fi

          echo "Syncing environment variables to Render from GitHub secrets…"
          # NOTE: this PUT replaces the full env-var set, so list everything
          # the service needs here.
          jq -n \
            --arg url "${SUPABASE_URL}" \
            --arg key "${SUPABASE_SERVICE_KEY}" \
            '[
              {key: "SUPABASE_URL",         value: $url},
              {key: "SUPABASE_SERVICE_KEY", value: $key},
              {key: "PYTHON_VERSION",       value: "3.12.5"}
            ]' > env.json

          curl --fail --silent --show-error \
            -X PUT "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @env.json > /dev/null

          echo "Triggering deploy…"
          curl --fail --silent --show-error \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"clearCache": "do_not_clear"}' > /dev/null

          echo "Deploy triggered. Watch progress in the Render dashboard."
