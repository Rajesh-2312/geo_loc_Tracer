<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Share your location</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="card">
    <h1>Location request</h1>

    <div class="requester">
      <span class="requester-label">You are being asked to share your live location with:</span>
      <strong class="requester-name" id="label">…</strong>
    </div>

    <p class="lede">
      Your browser will now ask for permission. Tap <strong>Allow</strong> and
      your live location is shared — no other steps needed. You can stop any time.
    </p>

    <p class="hint" id="count"></p>
    <div id="notice" class="notice hidden"></div>

    <div id="sharing" class="banner hidden">
      <span class="dot"></span>
      <div>
        <strong>You are sharing your live location.</strong>
        <span id="share-status">Requesting your location…</span>
      </div>
      <button id="stop-btn" type="button">Stop sharing</button>
    </div>

    <!-- Fallback only: shown if the browser needs a tap to raise the prompt,
         or if permission was denied and the person wants to retry. -->
    <div id="retry" class="hidden">
      <button id="retry-btn" type="button">Allow location</button>
    </div>

    <p id="message" class="message hidden"></p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/share.js"></script>
</body>
</html>
